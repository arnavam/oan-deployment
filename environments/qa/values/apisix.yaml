# Values for oan-helm/oan-apisix-gateway on the QA node, installed by the platform init (edge: apisix) as release
# `apisix` in namespace `api6-gateway`. Based on oan-helm environments/dev/values/oan-apisix-gateway.yaml.
#
# The chart binds the node's ports 80 and 443 (hostPort) and terminates TLS with the wildcard Secret from
# tls.k8s_secret; the platform adds the ApisixTls for qa.oanstaging.com and *.qa.oanstaging.com. The app charts,
# installed by Jenkins, add their own ApisixRoutes and Ingresses (ingressClassName: apisix).

apisix:
  # Single-member etcd from automation/sandbox/charts/apisix-etcd (local-path volume). The chart's built-in etcd
  # does not render next to its bundled Redis.
  etcd:
    enabled: false
  externalEtcd:
    host:
      - http://apisix-etcd.api6-gateway.svc.cluster.local:2379
    user: ""

# https://apisix-dashboard.qa.oanstaging.com/ui/, private addresses only (VPC, WireGuard, in-cluster).
adminDashboard:
  enabled: true
  host: apisix-dashboard.qa.oanstaging.com
  allowlist:
  - 10.0.0.0/8

# No catch-all: QA has no OpenG2P server behind APISIX, so hosts without a route of their own get a 404.
# To add one, set edge.enabled, edge.domain and edge.upstream as dev does, and drop the platform's ApisixTls
# (the edge brings its own).
edge:
  enabled: false
