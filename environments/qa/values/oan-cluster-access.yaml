# Values for oan-helm/oan-cluster-access on QA: the ServiceAccount Jenkins deploys the services with
# (oan-helm docs/cluster-access.md). Based on oan-helm environments/dev/values/oan-cluster-access.yaml.
#
# Kubernetes writes its token into Secret jenkins-qa-deployer-token in namespace a2c;
# cluster/write-kubeconfig.sh in oan-service-helm turns it into the kubeconfig Jenkins keeps as a Secret file
# credential (for example oan-qa-kubeconfig).

serviceAccount:
  name: jenkins-qa-deployer

# Built-in `admin` in each: the service's Helm release, Secrets, Jobs and APISIX routes.
deployNamespaces:
- a2c
- grievance
- da-app
- farmer-app
- leads
- sandbox
