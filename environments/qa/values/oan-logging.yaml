# Values for oan-helm/oan-logging on QA: the node log agent only (the chart's default). It tails /var/log/pods,
# redacts PII and ships over OTLP to the central OTel gateway, which writes to the central Loki read by the central
# Grafana. No Loki, MinIO or Grafana on this cluster (platform-config.yaml: logging: external).
# On oan_dev the same agent ships to openg2p_dev, 10.0.1.58:30317 (oan-helm docs/logging.md).

otel-agent:
  alternateConfig:
    exporters:
      otlp:
        # REQUIRED: <host>:<port> of the central OTel gateway, reachable from this node over the private network.
        # automation/oan-platform.sh refuses to run while it is empty.
        endpoint: ""
