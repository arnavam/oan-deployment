# Pod Security Admission levels for every namespace below, unless it sets its own.
# baseline blocks privileged pods, host namespaces and hostPath; restricted is only warned about.
podSecurity:
  enforce: baseline
  warn: restricted

# Namespaces every app namespace accepts traffic from: Prometheus scrapes.
alwaysAllowFrom:
  - cattle-monitoring-system

# Each namespace denies all ingress except from its own pods, alwaysAllowFrom and allowFrom.
# Egress stays open: the services call external APIs and resolve DNS.
namespaces:
  # The edge: clients reach APISIX from outside the cluster. privileged: APISIX binds the node's
  # ports 80 and 443 with hostPort, which baseline forbids.
  api6-gateway:
    openIngress: true
    podSecurity: privileged

  # The log agent (oan-logging): reads /var/log/pods through hostPath, which baseline forbids.
  # It only sends, so nothing needs to reach it.
  observability:
    podSecurity: privileged

  # Shared Postgres: only the Frappe services.
  frappe-common:
    allowFrom: [a2c, grievance, da-app, farmer-app]

  # Services, installed by Jenkins: only APISIX routes to them.
  a2c:
    allowFrom: [api6-gateway]
  grievance:
    allowFrom: [api6-gateway]
  da-app:
    allowFrom: [api6-gateway]
  farmer-app:
    allowFrom: [api6-gateway]
  leads:
    allowFrom: [api6-gateway]
  sandbox:
    allowFrom: [api6-gateway]
