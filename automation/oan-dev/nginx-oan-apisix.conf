# OAN dev: grievance and A2C hosts through the shared nginx edge to APISIX.
#
# Same shape as the registries. nginx on the openg2p_dev host (10.0.1.58) terminates TLS with the
# *.development.oanstaging.com certificate and proxies plain HTTP to the next hop. For the registries
# the hop is `upstream istio_ingress { server 10.0.1.58:30080; }`; here it is APISIX on the oan_dev
# k3s node (hostPort 80, private address 10.0.1.131). No certificate is needed in the cluster, so the
# gateway charts leave `tls.secretName` unset and create no ApisixTls.
#
# These server_names are exact, so nginx picks them over the `*.development.oanstaging.com` block that
# sends everything else to istio. Install as /etc/nginx/sites-available/oan-apisix.conf, symlink it into
# sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# Check before enabling: the certificate paths (`sudo nginx -T | grep ssl_certificate` shows the ones
# the wildcard block uses), and that 10.0.1.131 is still the APISIX node's private address
# (`kubectl get pod -n api6-gateway -o wide`).
upstream oan_apisix {
    server 10.0.1.131:80;
}

server {
    listen 80;
    server_name grievance-service.development.oanstaging.com a2c-service.development.oanstaging.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name grievance-service.development.oanstaging.com a2c-service.development.oanstaging.com;
    ssl_certificate     /etc/openg2p/certs/development-wildcard.oanstaging.com/fullchain.pem;
    ssl_certificate_key /etc/openg2p/certs/development-wildcard.oanstaging.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass                      http://oan_apisix;
        proxy_http_version              1.1;
        proxy_buffering                 on;
        proxy_buffers                   8 16k;
        proxy_buffer_size               16k;
        proxy_busy_buffers_size         32k;
        proxy_set_header                Upgrade $http_upgrade;
        proxy_set_header                Connection "upgrade";
        proxy_set_header                Host $host;
        proxy_set_header                X-Real-IP $remote_addr;
        proxy_set_header                X-Forwarded-Host $host;
        proxy_set_header                X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header                X-Forwarded-Proto https;
        proxy_pass_request_headers      on;
    }
}
